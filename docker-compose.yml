# Shotlake auf einem NAS oder Heimserver.
#   docker compose up -d        starten
#   docker compose logs -f      Protokoll ansehen
#   docker compose pull && docker compose up -d     auf die neueste Version aktualisieren
# Beim ersten Aufruf von http://<Adresse>:8000 legst du das Passwort der Oberfläche fest.
services:
  shotlake:
    image: ghcr.io/bri-b-dev/shotlake:latest
    container_name: shotlake
    restart: unless-stopped
    # Nur lokal erreichbar. Für den Zugriff im Netz einen Reverse-Proxy mit TLS davorsetzen
    # (Passwort und Sitzungs-Cookie laufen sonst unverschlüsselt) und hier "8000:8000" eintragen.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Alles, was bleibt: Datenbank, Rohdaten, Uploads, Zugangsdaten, Konfiguration, Sicherungen.
      # Mit einem Ordner statt eines Volumes (./data:/data) muss er dem Benutzer 10001 gehören:
      #   mkdir data && sudo chown 10001:10001 data
      - shotlake-data:/data
    environment:
      TZ: Europe/Berlin
      # Schlüssel der gespeicherten Zugangsdaten außerhalb des Volumens halten (empfohlen):
      #   erzeugen:  docker run --rm ghcr.io/bri-b-dev/shotlake python -c \
      #     "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # SHOTLAKE_SECRET_KEY: ${SHOTLAKE_SECRET_KEY}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  shotlake-data:
