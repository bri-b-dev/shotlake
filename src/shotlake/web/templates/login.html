{% extends "base.html" %}
{% block title %}Anmelden · Shotlake{% endblock %}
{% block bodyclass %}auth{% endblock %}
{% block content %}
<section class="auth-box">
  <img src="/static/logo.svg" alt="" width="72" height="72">
  <h1>Anmelden</h1>
  {% if error %}<p class="neg" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="inputs">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Passwort <input type="password" name="password" autocomplete="current-password" required autofocus></label>
    <button type="submit">Anmelden</button>
  </form>
</section>
{% endblock %}
