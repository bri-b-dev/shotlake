<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Shotlake{% endblock %}</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/static/fonts/space-grotesk-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/style.css">
<script>
  try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="{{ link(request, '/') }}" aria-label="Shotlake, Übersicht"><img src="/static/logo.svg" alt="" width="30" height="30"><span>Shot<b>lake</b></span></a>
  <nav aria-label="Hauptnavigation">
    {% set here = request.url.path %}
    <span class="navgroup">
      <a href="{{ link(request, '/') }}" {% if here == '/' %}aria-current="page"{% endif %}>Übersicht</a>
      <a href="{{ link(request, '/rounds', source=None) }}" {% if here.startswith('/rounds') %}aria-current="page"{% endif %}>Runden</a>
      <a href="{{ link(request, '/clubs') }}" {% if here == '/clubs' %}aria-current="page"{% endif %}>Schläger</a>
      <a href="{{ link(request, '/insights', source=None) }}" {% if here == '/insights' %}aria-current="page"{% endif %}>Hinweise</a>
    </span>
    <span class="navgroup">
      <a href="{{ link(request, '/notes') }}" {% if here.startswith('/notes') %}aria-current="page"{% endif %}>Notizen</a>
      <a href="{{ link(request, '/dedup') }}" {% if here.startswith('/dedup') %}aria-current="page"{% endif %}>Dubletten</a>
    </span>
    <span class="navgroup">
      <a href="{{ link(request, '/sources') }}" {% if here == '/sources' %}aria-current="page"{% endif %}>Quellen</a>
      <a href="{{ link(request, '/settings') }}" {% if here == '/settings' %}aria-current="page"{% endif %}>Einstellungen</a>
    </span>
  </nav>
  <span class="tools">
    <span class="seg" role="group" aria-label="Einheit">
      <a href="{{ link(request, here, u='m') }}" {% if unit == 'm' %}aria-current="true"{% endif %}>m</a>
      <a href="{{ link(request, here, u='yd') }}" {% if unit == 'yd' %}aria-current="true"{% endif %}>yd</a>
    </span>
    <button type="button" id="theme" aria-label="Darstellung wechseln (hell/dunkel)" title="Hell/Dunkel">◐</button>
  </span>
</div></header>
<main>{% block content %}{% endblock %}</main>
<script>
  document.getElementById("theme").addEventListener("click", function () {
    var root = document.documentElement;
    var dark = root.dataset.theme ? root.dataset.theme === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
  });
</script>
</body>
</html>
