[project]
name = "shotlake"
version = "0.1.0"
description = "Persönliche Golf-Datenplattform: sammelt, vereinheitlicht und wertet Golfdaten aus."
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    # Nicht 2.x: dessen Linux-Bibliothek braucht AVX2 und bricht auf vielen NAS-Prozessoren mit
    # "Illegal instruction" ab (Celeron J4025 getestet); 1.x läuft dort und schreibt ein Dateiformat,
    # das auch 2.x liest.
    "duckdb>=1.4,<2",
    "fastapi>=0.162.7",
    "jinja2>=3.1.6",
    "mcp>=2.3.0",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# Garmin Golf (inoffiziell): `uv sync --extra garmin`; die Anmeldung mit Zwei-Faktor-Code
# braucht die Token-API ab 0.3 (`return_on_mfa`, `resume_login`).
garmin = ["garminconnect>=0.3.20"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
shotlake = "shotlake.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shotlake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests", "tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
check_untyped_defs = true
