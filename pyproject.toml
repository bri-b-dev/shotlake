[project]
name = "shotlake"
version = "0.1.0"
description = "Persönliche Golf-Datenplattform: sammelt, vereinheitlicht und wertet Golfdaten aus."
requires-python = ">=3.12"
dependencies = ["duckdb>=1.1"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
shotlake = "shotlake.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shotlake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests", "tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
check_untyped_defs = true
